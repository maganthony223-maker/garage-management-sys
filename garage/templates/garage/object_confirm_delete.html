{% extends 'garage/base.html' %}
{% load garage_extras %}
{% block content %}
<div class="card" style="max-width:520px;margin:40px auto;text-align:center">
    <div class="avatar" style="background:var(--bad);margin:0 auto 14px;width:56px;height:56px">{% icon 'trash' 24 %}</div>
    <h2>Delete this record?</h2>
    <p class="muted">You are about to delete <b>{{ object }}</b>. This cannot be undone.</p>
    <form method="post" class="form-actions" style="justify-content:center">{% csrf_token %}
        <button class="btn danger" type="submit">Yes, delete</button>
        <a class="btn secondary" href="{% url prefix|add:'_list' %}">Cancel</a>
    </form>
</div>
{% endblock %}
